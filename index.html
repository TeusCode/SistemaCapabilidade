<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Capabilidade</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <div id="inserir">
            <div class="logo">
                <img width="150px" height="40px"
                    src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/dd/Stellantis.svg/2560px-Stellantis.svg.png"
                    alt="logo">
            </div>

            <h1>Process Capability</h1>

            <form id="formCap" name="dadosCapabilidade" action="https://sheetdb.io/api/v1/diu9gggbuf1l2" method="post">
                <p>
                    <input type="text" placeholder="Product Name" name="produto" id="iproduto" required>
                </p>
                <p>
                    <input type="number" placeholder="Component number" name="codigo" id="icodigo" required>
                </p>
                <p>
                    <input type="text" placeholder="Feature" id="icaracteristica" name="caracteristica">
                </p>
                <p>
                    <input type="text" id="imetMedicao" name="metMedicao" placeholder="Measurement method">
                </p>
                <p> Specs:
                    <input class="inpMn" id="imin" step="any" type="number" placeholder="Máx">
                    <input class="inpMn" id="imax" step="any" type="number" placeholder="Mín">
                </p>

                <!--
        <p>
          <input type="file" id="fileInput" name="fileInput" accept="image/*" required>
        </p> -->

                <br>
                <button class="botao" type="submit">
                    Cadastrar
                </button>

            </form>

        </div>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
