<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Capabilidade</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/medias.css" media="(min-width: 768px)">
    <link rel="shortcut icon" href="img/icon.png" type="image/x-icon">
</head>

<body>
    <main>
        <div id="inserir">
            <div class="logo">
                <img width="150px" height="40px"
                    src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/dd/Stellantis.svg/2560px-Stellantis.svg.png"
                    alt="logo">
            </div>

            <h1>Process Capability</h1>

            <form id="formCap" name="dadosCapabilidade" method="post">
                <select class="input select" name="responsavel" id="iresponsavel">
                    <option value="">Selecione</option>
                    <option value="supervisor">Supervisor</option>
                    <option value="analista">Analista</option>
                    <option value="gerente">Gerente</option>
                </select>
                <p>
                    <input class="input" type="text" autocomplete="off" placeholder="Nome do Produto" name="produto"
                        id="iproduto" required>
                </p>
                <p>
                    <input class="input" type="number" autocomplete="off" placeholder="Número do componente"
                        name="codigo" id="icodigo" required>
                </p>
                <p>
                    <input class="input" type="text" autocomplete="off" placeholder="Caracteristica"
                        id="icaracteristica" name="caracteristica">
                </p>
                <p>
                    <input class="input" type="text" autocomplete="off" id="imetMedicao" name="metMedicao"
                        placeholder="Método de medição">
                </p>
                <div class="limites">
                    <p> Limites:
                        <input width="50px" autocomplete="off" class="inpMn" id="imin" step="any" type="number"
                            placeholder="Mín">
                        <input width="50px" autocomplete="off" class="inpMn" id="imax" step="any" type="number"
                            placeholder="Máx">
                    </p>
                </div>

                <br>
                <button id="botaoC" class="botao" type="submit">
                    Cadastro
                </button>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
