<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Capabilidade</title>
    <link rel="stylesheet" href="css/style.css">
    <<link rel="stylesheet" href="css/medias.css" media="(min-width: 768px)">
</head>

<body>
    <main>
        <div id="inserir">
            <div class="logo">
                <img width="150px" height="40px"
                    src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/dd/Stellantis.svg/2560px-Stellantis.svg.png"
                    alt="logo">
            </div>

            <h1>Process Capability</h1>

            <form id="formCap" name="dadosCapabilidade" action="" method="post">
                <img src="img/inicial.jpg" alt="">
                
                <p>
                    <input type="text" placeholder="Nome do Produto" name="produto" id="iproduto" required>
                </p>
                <p>
                    <input type="number" placeholder="Número do componente" name="codigo" id="icodigo" required>
                </p>
                <p>
                    <input type="text" placeholder="Caracteristica" id="icaracteristica" name="caracteristica">
                </p>
                <p>
                    <input type="text" id="imetMedicao" name="metMedicao" placeholder="Método de medição">
                </p>
                <p> Espec:
                    <input width="50px" class="inpMn" id="imin" step="any" type="number" placeholder="Máx">
                    <input width="50px" class="inpMn" id="imax" step="any" type="number" placeholder="Mín">
                </p>

                <br>
                <button class="botao" type="submit">
                    Cadastrar
                </button>

                <p id="msg"></p>

        </div>



    </main>

    <script src="js/script.js"></script>
</body>

</html>
