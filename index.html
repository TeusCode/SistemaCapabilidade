<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Capabilidade</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <div id="inserir">
            <div class="logo">
                <img width="150px" height="40px"
                    src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/dd/Stellantis.svg/2560px-Stellantis.svg.png"
                    alt="logo">
            </div>

            <h1>Process Capability</h1>

            <form 
            name="dadosCapabilidade" 
            action="https://sheetdb.io/api/v1/diu9gggbuf1l2" method="post">
                <p>
                    <input type="number" placeholder="Part number" name="data[codigo]" id="icodigo" required>
                </p>

                <p>
                    <input type="text" placeholder="Product Name" name="data[produto]" id="iproduto" required>
                </p>

                <p>
                    <input type="number" placeholder="Diameter (mm)" name="data[diametro]" id="idiametro" required>
                </p>

                <!--
        <p>
          <input type="file" id="fileInput" name="fileInput" accept="image/*" required>
        </p> -->

                <br>
                <p><input class="botao" type="submit" value="Cadastrar"></p>
            </form>

            <p id="msg"></p>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
