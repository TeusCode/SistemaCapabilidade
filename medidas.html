<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserir medidas</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/medias.css" media="(min-width: 768px)">
</head>

<body>
    <main>
        <div id="inserir">
            <div class="logo">
                <img width="150px" height="40px"
                    src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/dd/Stellantis.svg/2560px-Stellantis.svg.png"
                    alt="logo">
            </div>

            <h1>Process Capability</h1>
            <br>
            <form id="formMed" name="medidas" action="" method="post">
                <p> Medições:</p>
                <br>
                <p><input autocomplete="off" width="0px" class="medida" id="medida" step="any" type="number"
                        placeholder="Adicione Medição"></p>



                <button class="botao" type="submit">Adicionar Medidas</button>

                <input class="botao" type="button" value="Voltar" onclick="voltar()">

                <p id="msg"></p>
        </div>



    </main>

    <script src="js/script.js"></script>
</body>

</html>
